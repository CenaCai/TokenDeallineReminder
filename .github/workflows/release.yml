name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Release preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role-key' }}
      NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
      PORT: 3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run start > /tmp/yao-dao-qi-la-web.log 2>&1 &
          echo $! > /tmp/yao-dao-qi-la-web.pid

      - name: API smoke tests
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:${PORT}/api/health")" = "200"
          test "$(curl -sS -o /tmp/home.html -w '%{http_code}' "http://127.0.0.1:${PORT}/")" = "200"
          test "$(curl -sS -o /tmp/wechat.html -w '%{http_code}' "http://127.0.0.1:${PORT}/api/auth/wechat")" = "200"

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/yao-dao-qi-la-web.pid ]; then
            kill "$(cat /tmp/yao-dao-qi-la-web.pid)" 2>/dev/null || true
          fi

  deploy-h5-archive:
    name: Deploy archived H5 to Pages
    runs-on: ubuntu-latest
    needs: release-check
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-h5')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./h5

      - id: deployment
        uses: actions/deploy-pages@v4

  upload-miniprogram:
    name: Upload Mini Program
    runs-on: ubuntu-latest
    needs: release-check
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-mp')
    steps:
      - uses: actions/checkout@v4

      - name: Check upload tooling
        run: |
          test -f miniprogram/package.json
          test -f miniprogram/scripts/upload.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install dependencies
        working-directory: miniprogram
        run: npm ci

      - name: Upload Mini Program
        working-directory: miniprogram
        env:
          MP_APPID: ${{ secrets.MP_APPID }}
          MP_PRIVATE_KEY: ${{ secrets.MP_PRIVATE_KEY }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          node scripts/upload.js --env prod --desc "Release ${TAG_NAME}" --ci
