<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>要到期啦 - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; padding: 40px 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #999; margin-bottom: 32px; }
    .card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1a1a1a; }
    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid #e5e5e5; border-radius: 10px; font-size: 14px; transition: border-color 0.15s; }
    input:focus { outline: none; border-color: #E8703A; box-shadow: 0 0 0 3px rgba(232,112,58,0.1); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #E8703A, #f09060); color: white; }
    .hint { font-size: 12px; color: #999; margin-top: 4px; }
    .status { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
    .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .status.error { display: block; background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ 设置</h1>
    <p class="subtitle">配置要到期啦 Chrome 扩展</p>

    <div class="card">
      <div class="card-title">Supabase 连接</div>
      <div class="form-group">
        <label for="supabase-url">Supabase URL</label>
        <input type="url" id="supabase-url" placeholder="https://xxx.supabase.co">
        <p class="hint">在 Supabase 项目设置中找到</p>
      </div>
      <div class="form-group">
        <label for="supabase-key">Anon Key</label>
        <input type="text" id="supabase-key" placeholder="eyJhbGciOi...">
        <p class="hint">Supabase 项目的公共匿名密钥</p>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Web 面板地址</div>
      <div class="form-group">
        <label for="web-url">Web App URL</label>
        <input type="url" id="web-url" placeholder="https://your-app.vercel.app" value="http://localhost:3000">
      </div>
    </div>

    <div class="card">
      <div class="card-title">登录状态</div>
      <div class="form-group">
        <label>当前状态</label>
        <p id="auth-status" style="font-size: 14px; color: #666;">未登录</p>
      </div>
      <button class="btn btn-primary" id="save-btn">保存配置</button>
      <div id="save-status" class="status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
